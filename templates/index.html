<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Súper en Línea</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <header class="sticky top-0 z-20 bg-white border-b shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3">
      <h1 class="text-xl font-bold text-emerald-700">🛒 Súper en Línea</h1>
      <input id="q" type="search" placeholder="Buscar leche, arroz, manzana…"
             class="flex-1 min-w-[200px] border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
      <select id="cat" class="border rounded-lg px-3 py-2 max-w-[220px]"><option value="">Todas las categorías</option></select>
      <button id="open-cart" class="relative bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg px-4 py-2">
        Carrito <span id="cart-count" class="ml-1 bg-white text-emerald-700 rounded-full px-2 text-sm font-semibold">0</span>
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <p id="summary" class="text-sm text-slate-500 mb-3"></p>
    <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-4"></div>
    <div class="flex justify-center gap-3 mt-8">
      <button id="prev" class="px-4 py-2 border rounded-lg bg-white disabled:opacity-40">← Anterior</button>
      <span id="page-label" class="py-2 text-sm"></span>
      <button id="next" class="px-4 py-2 border rounded-lg bg-white disabled:opacity-40">Siguiente →</button>
    </div>
  </main>

  <!-- Carrito lateral -->
  <div id="overlay" class="hidden fixed inset-0 bg-black/40 z-30"></div>
  <aside id="cart" class="fixed top-0 right-0 h-full w-full max-w-md bg-white z-40 shadow-xl translate-x-full transition-transform flex flex-col">
    <div class="p-4 border-b flex justify-between items-center">
      <h2 class="font-bold text-lg">Tu carrito</h2>
      <button id="close-cart" class="text-2xl leading-none">&times;</button>
    </div>
    <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
    <div class="p-4 border-t space-y-1 text-sm">
      <div class="flex justify-between"><span>Subtotal</span><span id="t-sub">$0.00</span></div>
      <div class="flex justify-between"><span>IVA (<span id="iva-pct">16</span>%)</span><span id="t-iva">$0.00</span></div>
      <div class="flex justify-between font-bold text-base"><span>Total MXN</span><span id="t-total">$0.00</span></div>
      <a id="go-checkout" href="/checkout" class="block text-center mt-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg py-2 font-semibold">Ir a pagar</a>
    </div>
  </aside>

<script>
const IVA = 0.16; // solo visual; el servidor recalcula el total real
const money = n => new Intl.NumberFormat('es-MX', {style:'currency', currency:'MXN'}).format(n);
const $ = s => document.querySelector(s);
let state = { page: 1, perPage: 24, total: 0 };
let cart = JSON.parse(localStorage.getItem('cart') || '{}'); // {id: {id,nombre,precio,imagen,qty}}

function saveCart(){ localStorage.setItem('cart', JSON.stringify(cart)); renderCart(); }
function esc(s){ const d=document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

async function loadCategories(){
  const cats = await (await fetch('/api/categories')).json();
  $('#cat').insertAdjacentHTML('beforeend', cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join(''));
}

async function loadProducts(){
  const params = new URLSearchParams({ q: $('#q').value, categoria: $('#cat').value, page: state.page, per_page: state.perPage });
  const data = await (await fetch('/api/products?' + params)).json();
  state.total = data.total;
  const pages = Math.max(1, Math.ceil(data.total / state.perPage));
  $('#summary').textContent = `${data.total} productos`;
  $('#page-label').textContent = `Página ${state.page} de ${pages}`;
  $('#prev').disabled = state.page <= 1; $('#next').disabled = state.page >= pages;
  $('#grid').innerHTML = data.items.map(p => `
    <article class="bg-white rounded-xl border p-3 flex flex-col">
      <div class="aspect-square bg-slate-100 rounded-lg overflow-hidden mb-2 flex items-center justify-center">
        ${p.imagen ? `<img src="${esc(p.imagen)}" alt="${esc(p.nombre)}" loading="lazy" class="object-contain w-full h-full">` : '🛍️'}
      </div>
      <p class="text-xs text-slate-500">${esc(p.marca || '')}</p>
      <h3 class="text-sm font-medium leading-snug line-clamp-2 flex-1">${esc(p.nombre)}</h3>
      <p class="text-lg font-bold text-emerald-700 mt-1">${money(p.precio)}</p>
      <button data-id="${p.id}" ${p.disponible ? '' : 'disabled'}
        class="add mt-2 rounded-lg py-1.5 text-sm font-semibold ${p.disponible ? 'bg-emerald-600 hover:bg-emerald-700 text-white' : 'bg-slate-200 text-slate-500'}">
        ${p.disponible ? 'Agregar' : 'Agotado'}</button>
    </article>`).join('');
  document.querySelectorAll('.add').forEach(b => b.onclick = () => {
    const p = data.items.find(x => x.id == b.dataset.id);
    cart[p.id] = cart[p.id] || { id: p.id, nombre: p.nombre, precio: p.precio, imagen: p.imagen, qty: 0 };
    cart[p.id].qty = Math.min(cart[p.id].qty + 1, 50); cart[p.id].precio = p.precio;
    saveCart(); openCart();
  });
}

function renderCart(){
  const items = Object.values(cart);
  $('#cart-count').textContent = items.reduce((a,i) => a + i.qty, 0);
  $('#cart-items').innerHTML = items.length ? items.map(i => `
    <div class="flex gap-3 items-center">
      ${i.imagen ? `<img src="${esc(i.imagen)}" class="w-14 h-14 object-contain rounded bg-slate-100">` : ''}
      <div class="flex-1 text-sm"><p class="line-clamp-2">${esc(i.nombre)}</p><p class="text-emerald-700 font-semibold">${money(i.precio)}</p></div>
      <div class="flex items-center gap-1">
        <button data-d="-1" data-id="${i.id}" class="qty w-7 h-7 border rounded">−</button>
        <span class="w-6 text-center">${i.qty}</span>
        <button data-d="1" data-id="${i.id}" class="qty w-7 h-7 border rounded">+</button>
      </div>
    </div>`).join('') : '<p class="text-slate-500 text-center mt-10">Tu carrito está vacío</p>';
  document.querySelectorAll('.qty').forEach(b => b.onclick = () => {
    const i = cart[b.dataset.id]; i.qty += +b.dataset.d;
    if (i.qty <= 0) delete cart[b.dataset.id]; else i.qty = Math.min(i.qty, 50);
    saveCart();
  });
  const sub = items.reduce((a,i) => a + i.precio * i.qty, 0);
  $('#t-sub').textContent = money(sub); $('#t-iva').textContent = money(sub * IVA); $('#t-total').textContent = money(sub * (1 + IVA));
  $('#go-checkout').classList.toggle('pointer-events-none', !items.length);
  $('#go-checkout').classList.toggle('opacity-50', !items.length);
}

const openCart = () => { $('#cart').classList.remove('translate-x-full'); $('#overlay').classList.remove('hidden'); };
const closeCart = () => { $('#cart').classList.add('translate-x-full'); $('#overlay').classList.add('hidden'); };
$('#open-cart').onclick = openCart; $('#close-cart').onclick = closeCart; $('#overlay').onclick = closeCart;

let t; $('#q').oninput = () => { clearTimeout(t); t = setTimeout(() => { state.page = 1; loadProducts(); }, 300); };
$('#cat').onchange = () => { state.page = 1; loadProducts(); };
$('#prev').onclick = () => { state.page--; loadProducts(); window.scrollTo(0,0); };
$('#next').onclick = () => { state.page++; loadProducts(); window.scrollTo(0,0); };

renderCart(); loadCategories(); loadProducts();
</script>
</body>
</html>
