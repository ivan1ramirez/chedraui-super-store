name: Chedraui Price Updater

on:
  schedule:
    - cron: "0 11 * * *"      # diario 11:00 UTC (~06:00 hora de Cancún)
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Páginas máximas por categoría (vacío = todas)"
        required: false
        default: ""
      use_browser:
        description: "Usar Playwright headless"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: chedraui-price-updater
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar Playwright (solo si se solicita)
        if: ${{ inputs.use_browser }}
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Ejecutar scraper
        env:
          MARKUP_PCT: ${{ vars.MARKUP_PCT || '0' }}
          SCRAPER_SLEEP: ${{ vars.SCRAPER_SLEEP || '1.5' }}
          CHEDRAUI_CATEGORY_IDS: ${{ secrets.CHEDRAUI_CATEGORY_IDS }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.max_pages }}" ]; then ARGS="$ARGS --max-pages ${{ inputs.max_pages }}"; fi
          if [ "${{ inputs.use_browser }}" = "true" ]; then ARGS="$ARGS --browser"; fi
          if [ -n "$CHEDRAUI_CATEGORY_IDS" ]; then ARGS="$ARGS --categories $CHEDRAUI_CATEGORY_IDS"; fi
          python scraper.py $ARGS

      - name: Commit y push de cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json data/store.db
          if git diff --cached --quiet; then
            echo "Sin cambios de precio."
          else
            git commit -m "chore: actualización de precios Chedraui $(date -u +'%Y-%m-%d')"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi
